<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Vendas — Vitanuts</title>
<style>
  :root{
    --bg:#F7F0E1;
    --navy:#16233F;
    --navy-2:#1D2E52;
    --green:#3C7A4D;
    --gold:#C9A24B;
    --gold-light:#E4CD8E;
    --red:#B5453B;
    --ink:#22201A;
    --muted:#8A8270;
    --card:#FFFFFF;
    --line:#EAE1CC;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);padding:28px;}
  .wrap{max-width:1180px;margin:0 auto;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;}
  .toolbar h1{font-size:20px;margin:0;font-weight:700;}
  .toolbar .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  .badge{font-size:12px;padding:4px 10px;border-radius:999px;background:#EAF3EC;color:var(--green);font-weight:600;}
  .badge.warn{background:#FBF1DD;color:#9C7A22;}
  .badge.off{background:#F5E7E5;color:var(--red);}
  .meta-card{background:var(--card);border-radius:16px;padding:22px 26px;display:flex;align-items:center;gap:28px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,0.04);}
  .barrinha{flex:0 0 110px;text-align:center;}
  .barrinha svg{width:96px;height:96px;}
  .barrinha .pct{font-weight:700;font-size:20px;margin-top:4px;}
  .meta-text h2{font-size:15px;margin:0 0 6px 0;font-weight:700;}
  .meta-text p{font-size:12.5px;color:var(--muted);margin:0 0 12px 0;line-height:1.5;max-width:640px;}
  .legend{display:flex;gap:22px;flex-wrap:wrap;align-items:center;font-size:12.5px;}
  .legend span{display:inline-flex;align-items:center;gap:6px;font-weight:600;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .dot.green{background:var(--green);}
  .dot.gold{background:var(--gold-light);border:1px solid var(--gold);}
  .dot.outline{background:transparent;border:1.5px dashed var(--muted);}
  .kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px;}
  .kpi{background:linear-gradient(180deg,var(--navy-2),var(--navy));border-radius:14px;padding:16px 18px;color:#fff;}
  .kpi .label{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:#9FB0CC;font-weight:700;margin-bottom:8px;}
  .kpi .value{font-size:22px;font-weight:800;letter-spacing:-.01em;}
  .kpi .delta{font-size:11.5px;margin-top:6px;font-weight:600;}
  .kpi .delta.good{color:#8FD9A3;}
  .kpi .delta.bad{color:#F0A69E;}
  .kpi .delta.neutral{color:#B9C4DA;}
  .panels{display:grid;grid-template-columns:1fr;gap:16px;}
  .panel{background:var(--card);border-radius:16px;padding:20px 22px;box-shadow:0 1px 2px rgba(0,0,0,0.04);}
  .panel h3{font-size:14.5px;margin:0 0 2px 0;font-weight:700;}
  .panel .sub{font-size:12px;color:var(--muted);margin-bottom:16px;}
  table{width:100%;border-collapse:collapse;}
  thead th{text-align:left;font-size:10.5px;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;font-weight:700;padding-bottom:8px;border-bottom:1px solid var(--line);}
  thead th.num{text-align:right;}
  tbody td{padding:10px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  tbody tr:last-child td{border-bottom:none;}
  .prod-name{font-size:13px;font-weight:600;}
  .prod-sku{font-size:10.5px;color:var(--muted);margin-top:1px;}
  .num{text-align:right;font-size:13px;font-weight:700;white-space:nowrap;}
  .pct{text-align:right;font-size:12px;color:var(--muted);width:60px;}
  .bar-track{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--green);border-radius:3px;}
  .empty{text-align:center;padding:60px 20px;color:var(--muted);}

  .mini-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;}
  .mini-card{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;}
  .mini-card .mc-label{font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .mini-card .mc-value{font-size:19px;font-weight:800;color:var(--ink);letter-spacing:-.01em;}
  .mini-card .mc-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
  .mini-card .mc-bar{height:4px;background:var(--line);border-radius:3px;margin-top:9px;overflow:hidden;}
  .mini-card .mc-bar-fill{height:100%;border-radius:3px;}

  .login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh;}
  .login-card{background:var(--card);padding:32px;border-radius:16px;box-shadow:0 1px 4px rgba(0,0,0,0.1);text-align:center;max-width:360px;width:100%;}
  .login-card h2{margin-top:0;}
  .login-card input{width:100%;padding:10px;font-size:16px;border:1px solid var(--line);border-radius:6px;margin-bottom:14px;}
  .login-card button{width:100%;padding:10px 24px;font-size:15px;background:var(--navy);color:#fff;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
  .login-card .erro{color:var(--red);font-size:13px;margin-bottom:10px;}

  @media (max-width:900px){.kpi-grid{grid-template-columns:repeat(2,1fr);}.meta-card{flex-direction:column;align-items:flex-start;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ================== CONFIGURAÇÃO — só isso precisa ser trocado ==================
const API_URL = "https://script.google.com/macros/s/AKfycbxTNAEDQH8IAu59RFIY5IPonXCBzHjGJDAsokt68JW5_siAZLEpUA0h2BcCOtxUJl9BsA/exec";
// ==================================================================================

let dados = null;
let metaMes = 200000;
let carteiraAberto = null;
let carteiraEditadaManualmente = false;

function getSenhaSalva(){ return sessionStorage.getItem('painel_senha') || ''; }
function salvarSenha(s){ sessionStorage.setItem('painel_senha', s); }

function renderLogin(erro){
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <h2>Painel de Vendas — Vitanuts</h2>
        ${erro ? '<div class="erro">Senha incorreta.</div>' : ''}
        <input type="password" id="senhaInput" placeholder="Senha" autofocus>
        <button id="btnEntrar">Entrar</button>
      </div>
    </div>
  `;
  document.getElementById('btnEntrar').addEventListener('click', tentarLogin);
  document.getElementById('senhaInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') tentarLogin();
  });
}

async function tentarLogin(){
  const senha = document.getElementById('senhaInput').value;
  await carregarDados(senha, true);
}

async function carregarDados(senha, veioDoLogin){
  try {
    const json = await buscarViaJsonp(API_URL, senha);
    if(json.erro === 'senha_incorreta'){
      renderLogin(true);
      return;
    }
    salvarSenha(senha);
    dados = json;
    if(!carteiraEditadaManualmente && dados.carteira_aberto){
      carteiraAberto = Number(dados.carteira_aberto.valor_total || 0);
    }
    render();
  } catch(err){
    document.getElementById('app').innerHTML = `<div class="empty"><p>Erro ao buscar dados: ${err.message}</p></div>`;
  }
}

// Busca os dados via JSONP (uma tag <script> dinâmica) em vez de fetch(),
// porque o navegador bloqueia fetch() entre domínios diferentes (CORS) —
// GitHub Pages e Google Apps Script são domínios diferentes. Tags
// <script> não têm essa restrição.
function buscarViaJsonp(url, senha){
  return new Promise((resolve, reject) => {
    const nomeCallback = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    let terminou = false;

    window[nomeCallback] = function(dados){
      terminou = true;
      resolve(dados);
      delete window[nomeCallback];
      script.remove();
    };

    script.src = url + '?senha=' + encodeURIComponent(senha) + '&callback=' + nomeCallback + '&_=' + Date.now();
    script.onerror = () => {
      if(!terminou) reject(new Error('Falha ao carregar dados (verifique a URL da API)'));
      delete window[nomeCallback];
      script.remove();
    };
    document.body.appendChild(script);

    setTimeout(() => {
      if(!terminou){
        reject(new Error('Tempo esgotado buscando dados'));
        delete window[nomeCallback];
        script.remove();
      }
    }, 60000);
  });
}

function formatarDataHora(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function brl(v){ return v.toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0}); }
function valorItem(item){
  if(item.valorTotal !== undefined && item.valorTotal !== null) return Number(item.valorTotal);
  return Number(item.valor ?? 0) * Number(item.quantidade ?? 1);
}
function valorNota(n){
  if(n.valorNota !== undefined && n.valorNota !== null) return Number(n.valorNota);
  if(n.total !== undefined && n.total !== null) return Number(n.total);
  return (n.itens || []).reduce((s, it) => s + valorItem(it), 0);
}
function nomeCliente(n){ return (n.contato && n.contato.nome) ? n.contato.nome : 'Cliente não identificado'; }
function valorPedidoCarteira(p){
  const campos = ['total', 'totalProdutos', 'valorTotal'];
  for(const c of campos){
    if(p[c] !== undefined && p[c] !== null) return Number(p[c]);
  }
  return 0;
}

// Classifica a nota como "B2C" ou "B2B". Ordem de prioridade:
// 1) natureza da operação real do Bling (dados.naturezas_operacao) — mais
//    confiável, mas só funciona quando esse mapa vem populado.
// 2) CNPJ (14 dígitos) + Inscrição Estadual preenchida no cliente — sinal
//    estrutural de empresa/revenda, não depende de ninguém ter digitado
//    texto certo em campo nenhum.
// 3) texto livre de informacoesAdicionais, como último recurso — mas
//    ignorando "revenda" quando vem negada (ex: "Proibida revenda", que
//    aparece em notas de amostra/divulgação e não é venda B2B nenhuma).
function classificarNota(n, naturezasOperacao){
  const idNatureza = n.naturezaOperacao && n.naturezaOperacao.id;
  const nomeNatureza = (naturezasOperacao && idNatureza && naturezasOperacao[idNatureza] || '').toLowerCase();
  if(nomeNatureza.includes('revenda')) return 'B2B';
  if(nomeNatureza.includes('consumidor final')) return 'B2C';

  const doc = ((n.contato && n.contato.numeroDocumento) || '').replace(/\D/g, '');
  const temIE = !!(n.contato && n.contato.ie && n.contato.ie.trim());
  if(doc.length === 14 && temIE) return 'B2B';

  const texto = (n.itens || []).map(i => i.informacoesAdicionais || '').join(' ').toLowerCase();
  if(texto.includes('consumidor final')) return 'B2C';

  const negacoes = ['proibida revenda', 'proibido revenda', 'sem revenda', 'não revenda', 'nao revenda'];
  const temRevendaNegada = negacoes.some(neg => texto.includes(neg));
  if(texto.includes('revenda') && !temRevendaNegada) return 'B2B';

  return 'Não classificado';
}

// Classifica pedido em aberto (carteira) como B2C/B2B usando o mesmo
// critério estrutural: tipoPessoa vindo do Bling é o sinal mais confiável
// que existe (F = pessoa física, J = pessoa jurídica), então tem
// prioridade; CNPJ+IE funciona como reforço/fallback se tipoPessoa vier
// vazio por algum motivo.
function classificarPedidoCarteira(p){
  const tipo = p.contato && p.contato.tipoPessoa;
  if(tipo === 'F') return 'B2C';
  if(tipo === 'J') return 'B2B';
  const doc = ((p.contato && p.contato.numeroDocumento) || '').replace(/\D/g, '');
  const temIE = !!(p.contato && p.contato.ie && p.contato.ie.trim());
  if(doc.length === 14 && temIE) return 'B2B';
  if(doc.length === 11) return 'B2C';
  return 'Não identificado';
}

// Identifica notas de amostra/divulgação (influencer, MKT, brindes) —
// têm "Sem valor comercial" no texto dos itens. Essas notas continuam
// aparecendo classificadas normalmente no painel de B2C x B2B (pra ficar
// visível onde caíram), mas não devem contar como faturamento real nem
// entrar no cálculo da meta, tendência, clientes positivados ou ranking
// de produtos — não são vendas de verdade.
function ehNotaAmostra(n){
  const texto = (n.itens || []).map(i => i.informacoesAdicionais || '').join(' ').toLowerCase();
  return texto.includes('sem valor comercial');
}

function notasDoMesAtual(notas){
  const hoje = new Date();
  const mes = hoje.getMonth();
  const ano = hoje.getFullYear();
  return notas.filter(n => {
    if(!n.dataEmissao) return false;
    const d = new Date(n.dataEmissao);
    return d.getMonth() === mes && d.getFullYear() === ano;
  });
}
function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str ?? ''; return div.innerHTML; }
function svgBarrinha(pctRealizado, pctComCarteira){
  const w = 96, h = 40, r = h/2;
  const wRealizado = w * pctRealizado;
  const wComCarteira = w * pctComCarteira;
  return `
  <svg viewBox="0 0 ${w} ${h+56}" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="capsule"><rect x="0" y="0" width="${w}" height="${h}" rx="${r}" ry="${r}"/></clipPath></defs>
    <g transform="translate(0,8)">
      <rect x="1" y="1" width="${w-2}" height="${h-2}" rx="${r}" ry="${r}" fill="none" stroke="#B9AF95" stroke-width="1.5" stroke-dasharray="3,3"/>
      <g clip-path="url(#capsule)">
        <rect x="0" y="0" width="${wComCarteira}" height="${h}" fill="#E4CD8E" opacity="0.75"/>
        <rect x="0" y="0" width="${wRealizado}" height="${h}" fill="#3C7A4D"/>
      </g>
    </g>
  </svg>`;
}
const CORES_GRUPO = {
  'B2C': 'var(--gold)',
  'B2B': 'var(--navy)',
  'Não classificado': 'var(--muted)',
  'Não identificado': 'var(--muted)'
};

function miniCardsGrupo(entradas, total){
  if(entradas.length === 0) return '<p style="font-size:12.5px;color:var(--muted);">Sem dados neste período ainda.</p>';
  const cards = entradas.map(([nome, valor, extra]) => {
    const cor = CORES_GRUPO[nome] || 'var(--muted)';
    const pct = total > 0 ? (valor/total*100) : 0;
    return `
    <div class="mini-card">
      <div class="mc-label"><span class="dot" style="background:${cor}"></span>${escapeHtml(nome)}</div>
      <div class="mc-value">${brl(valor)}</div>
      <div class="mc-sub">${extra ? extra + ' · ' : ''}${pct.toFixed(1)}% do total</div>
      <div class="mc-bar"><div class="mc-bar-fill" style="width:${pct.toFixed(0)}%;background:${cor}"></div></div>
    </div>`;
  }).join('');
  return `<div class="mini-cards">${cards}</div>`;
}

function rankingTable(lista, total, maior){
  if(lista.length === 0) return '<p style="font-size:12.5px;color:var(--muted);">Sem vendas de produto registradas neste mês ainda.</p>';
  const linhas = lista.map(p => `
    <tr>
      <td>
        <div class="prod-name">${escapeHtml(p.nome)}</div>
        <div class="prod-sku">${escapeHtml(p.sku)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(p.valor/maior*100).toFixed(0)}%"></div></div>
      </td>
      <td class="num">${brl(p.valor)}</td>
      <td class="pct">${total>0 ? (p.valor/total*100).toFixed(1) : '0.0'}%</td>
    </tr>`).join('');
  return `<table><thead><tr><th>Produto</th><th class="num">Real R$</th><th class="pct">% do top 10</th></tr></thead><tbody>${linhas}</tbody></table>`;
}

function render(){
  if(!dados || dados.erro){
    document.getElementById('app').innerHTML = '<div class="empty"><p>Ainda não há dados sincronizados. Aguarde o primeiro ciclo automático (roda a cada 15 min).</p></div>';
    return;
  }

  const notasMes = notasDoMesAtual(dados.notas || []);
  const notasAmostra = notasMes.filter(ehNotaAmostra);
  const notasParaMeta = notasMes.filter(n => !ehNotaAmostra(n));
  const valorAmostras = notasAmostra.reduce((s,n)=>s+valorNota(n), 0);

  const faturamentoReal = notasParaMeta.reduce((s,n)=>s+valorNota(n), 0);
  const hoje = new Date();
  const diaAtual = hoje.getDate();
  const diasNoMes = new Date(hoje.getFullYear(), hoje.getMonth()+1, 0).getDate();
  const tendencia = diaAtual > 0 ? (faturamentoReal / diaAtual) * diasNoMes : 0;
  const clientesPositivados = new Set(notasParaMeta.map(n => (n.contato && n.contato.id) || nomeCliente(n))).size;

  const gapMeta = Math.max(metaMes - faturamentoReal, 0);
  const realMaisCarteira = faturamentoReal + (carteiraAberto || 0);
  const gapCarteira = Math.max(metaMes - realMaisCarteira, 0);
  const pctRealizado = metaMes > 0 ? Math.min(faturamentoReal / metaMes, 1) : 0;
  const pctRealCarteira = metaMes > 0 ? Math.min(realMaisCarteira / metaMes, 1) : 0;

  const produtos = {};
  notasParaMeta.forEach(n => {
    (n.itens || []).forEach(item => {
      const sku = item.codigo || item.produto?.codigo || '—';
      const nome = item.descricao || item.produto?.descricao || 'Produto sem nome';
      const valor = valorItem(item);
      const key = sku + '|' + nome;
      if(!produtos[key]) produtos[key] = {sku, nome, valor:0};
      produtos[key].valor += valor;
    });
  });
  const rankingProdutos = Object.values(produtos).sort((a,b)=>b.valor-a.valor).slice(0,10);
  const totalTop10 = rankingProdutos.reduce((s,p)=>s+p.valor,0);
  const maiorValor = rankingProdutos.length ? rankingProdutos[0].valor : 1;

  // ---- Faturado: B2C x B2B ----
  const grupoFaturado = { 'B2C': { valor:0, clientes:new Set() }, 'B2B': { valor:0, clientes:new Set() }, 'Não classificado': { valor:0, clientes:new Set() } };
  notasMes.forEach(n => {
    const grupo = classificarNota(n, dados.naturezas_operacao);
    grupoFaturado[grupo].valor += valorNota(n);
    grupoFaturado[grupo].clientes.add((n.contato && n.contato.id) || nomeCliente(n));
  });

  // ---- Carteira: B2C x B2B (mesmo esquema visual/rótulo do Faturado) ----
  const pedidosCarteira = (dados.carteira_aberto && dados.carteira_aberto.pedidos) || [];
  const grupoCarteira = { 'B2C': 0, 'B2B': 0, 'Não identificado': 0 };
  pedidosCarteira.forEach(p => {
    const grupo = classificarPedidoCarteira(p);
    grupoCarteira[grupo] += valorPedidoCarteira(p);
  });

  const avisoSync = dados.sincronizacao_completa === false
    ? `<div class="badge warn" style="margin-bottom:12px;display:inline-block;">Sincronizando histórico do mês: ${dados.notas_com_itens_processados}/${dados.total_notas} notas processadas</div><br>`
    : '';

  // Aviso de diagnóstico: se a carteira veio zerada E o Apps Script
  // reportou erro HTTP na chamada de pedidos, mostra isso na tela em vez
  // de simplesmente aparecer "R$ 0" sem explicação nenhuma.
  const debugCarteira = dados.carteira_aberto && dados.carteira_aberto.debug;
  const avisoCarteira = (pedidosCarteira.length === 0 && debugCarteira && debugCarteira.erro_http)
    ? `<div class="badge off" style="margin-bottom:12px;display:inline-block;">Carteira não carregou: erro ${debugCarteira.erro_http.status} ao buscar pedidos no Bling (ver Registros de execução no Apps Script)</div><br>`
    : '';

  document.getElementById('app').innerHTML = `
    <div class="toolbar">
      <div>
        <h1>Painel de Vendas — Vitanuts</h1>
        <div class="sub">Gerado em ${formatarDataHora(dados.gerado_em)} · ${dados.total_notas} notas no período (${dados.periodo_inicio} a ${dados.periodo_fim})</div>
      </div>
      <span class="badge">atualização automática</span>
    </div>

    ${avisoSync}
    ${avisoCarteira}
    <div class="meta-card">
      <div class="barrinha">
        ${svgBarrinha(pctRealizado, pctRealCarteira)}
        <div class="pct">${(pctRealizado*100).toFixed(0)}%</div>
      </div>
      <div class="meta-text">
        <h2>Meta do mês: quanto da barrinha já foi preenchida</h2>
        <p>O contorno claro mostra o que ainda falta vender; o preenchimento verde é o realizado, e o dourado translúcido soma o realizado + carteira em aberto.</p>
        <div class="legend">
          <span><span class="dot green"></span>Realizado&nbsp; ${(pctRealizado*100).toFixed(1)}%</span>
          <span><span class="dot gold"></span>Realizado + carteira&nbsp; ${(pctRealCarteira*100).toFixed(1)}%</span>
          <span><span class="dot outline"></span>Meta&nbsp; R$ ${metaMes.toLocaleString('pt-BR')}</span>
        </div>
      </div>
    </div>

    <div class="kpi-grid">
      <div class="kpi"><div class="label">Faturamento real</div><div class="value">${brl(faturamentoReal)}</div><div class="delta neutral">${(pctRealizado*100).toFixed(1)}% da meta</div></div>
      <div class="kpi"><div class="label">Meta do mês</div><div class="value">${brl(metaMes)}</div><div class="delta neutral">fixa por enquanto</div></div>
      <div class="kpi"><div class="label">Gap até a meta</div><div class="value">${brl(gapMeta)}</div><div class="delta bad">${(100-pctRealizado*100).toFixed(1)}% faltando</div></div>
      <div class="kpi"><div class="label">Carteira em aberto</div><div class="value">${brl(carteiraAberto || 0)}</div><div class="delta neutral">${dados.carteira_aberto ? dados.carteira_aberto.total_pedidos + ' pedidos' : '-'}</div></div>
      <div class="kpi"><div class="label">Real + carteira</div><div class="value">${brl(realMaisCarteira)}</div><div class="delta good">${(pctRealCarteira*100).toFixed(1)}% da meta se fechar tudo</div></div>
      <div class="kpi"><div class="label">Tendência de fechamento</div><div class="value">${brl(tendencia)}</div><div class="delta ${tendencia>=metaMes?'good':'bad'}">${((tendencia/metaMes)*100).toFixed(1)}% da meta projetada</div></div>
      <div class="kpi"><div class="label">Clientes positivados</div><div class="value">${clientesPositivados}</div><div class="delta neutral">clientes com faturamento no mês</div></div>
      <div class="kpi"><div class="label">Gap se carteira fechar</div><div class="value">${brl(gapCarteira)}</div><div class="delta bad">${metaMes>0 ? ((gapCarteira/metaMes)*100).toFixed(1) : '0'}% ainda faltaria</div></div>
    </div>

    <div class="panels">
      <div class="panel">
        <h3>Faturado — B2C × B2B</h3>
        <div class="sub">Divisão do faturamento real do mês por classificação da nota${valorAmostras > 0 ? ` — não inclui ${brl(valorAmostras)} em ${notasAmostra.length} nota(s) de amostra/divulgação (sem valor comercial, não contam pra meta)` : ''}</div>
        ${miniCardsGrupo(
          Object.entries(grupoFaturado)
            .filter(([,v]) => v.valor > 0 || v.clientes.size > 0)
            .map(([nome, v]) => [nome, v.valor, v.clientes.size + ' clientes']),
          Object.values(grupoFaturado).reduce((s,v)=>s+v.valor,0)
        )}
      </div>

      <div class="panel">
        <h3>Carteira em aberto — B2C × B2B</h3>
        <div class="sub">Divisão dos pedidos ainda não faturados por tipo de cliente</div>
        ${miniCardsGrupo(
          Object.entries(grupoCarteira).filter(([,v]) => v > 0),
          Object.values(grupoCarteira).reduce((s,v)=>s+v,0)
        )}
      </div>

      <div class="panel">
        <h3>Ranking de produtos por faturamento real</h3>
        <div class="sub">Quem está puxando o resultado do mês — top 10 por faturamento real</div>
        ${rankingTable(rankingProdutos, totalTop10, maiorValor)}
      </div>
    </div>
  `;
}

// inicialização: usa senha salva na sessão, se tiver; senão mostra login
const senhaSalva = getSenhaSalva();
if(senhaSalva){
  carregarDados(senhaSalva, false);
} else {
  renderLogin(false);
}

// re-busca os dados a cada 5 minutos, sem precisar recarregar a página
setInterval(() => {
  const s = getSenhaSalva();
  if(s) carregarDados(s, false);
}, 5 * 60 * 1000);
</script>
</body>
</html>
