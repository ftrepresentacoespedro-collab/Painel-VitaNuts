<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel de Vendas — Vitanuts</title>
<style>
/* ===================== Nocturne — design tokens e componentes base ===================== */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

:root {
  --color-bg: #161826;
  --color-surface: #232532;
  --color-text: #e9e9ed;
  --color-accent: #9184d9;
  --color-accent-2: #a7a1db;
  --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);

  --color-neutral-100: #f3f5fe;
  --color-neutral-200: #e4e7f5;
  --color-neutral-300: #cfd3e5;
  --color-neutral-400: #b2b6ca;
  --color-neutral-500: #9397ab;
  --color-neutral-600: #75798c;
  --color-neutral-700: #595d6c;
  --color-neutral-800: #3f424d;
  --color-neutral-900: #292b31;

  --color-accent-100: #f5f4ff;
  --color-accent-200: #e7e5fe;
  --color-accent-300: #d2cefd;
  --color-accent-400: #b5abfc;
  --color-accent-500: #968ae0;
  --color-accent-600: #796cbf;
  --color-accent-700: #5d5294;
  --color-accent-800: #423a6a;
  --color-accent-900: #2b2741;

  --color-accent-2-100: #f5f4ff;
  --color-accent-2-200: #e7e5fe;
  --color-accent-2-300: #d2cefd;
  --color-accent-2-400: #b5afe8;
  --color-accent-2-500: #9690c9;
  --color-accent-2-600: #7972a9;
  --color-accent-2-700: #5c5783;
  --color-accent-2-800: #423e5d;
  --color-accent-2-900: #2b293a;

  --color-red: #e2685f;
  --color-red-bg: rgba(226, 104, 95, 0.14);
  --color-amber: #e0b355;
  --color-amber-bg: rgba(224, 179, 85, 0.14);
  --color-green: #6fcf97;

  --font-heading: "Inter", system-ui, sans-serif;
  --font-heading-weight: 500;
  --font-body: "Inter", system-ui, sans-serif;

  --space-1: 2.8px;
  --space-2: 5.6px;
  --space-3: 8.4px;
  --space-4: 11.2px;
  --space-6: 16.8px;
  --space-8: 22.4px;

  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 14px;

  --shadow-sm: 0 0 0 1px #3f424d;
  --shadow-md: 0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,0.55);
  --shadow-lg: 0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,0.65);
}

* , *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--color-bg); color: var(--color-text); font-family: var(--font-body); font-size: 15px; line-height: 1.55; font-weight: 400; }
h1, h2, h3, h4, h5, h6 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2); }
h1 { font-size: 30px; }
h2 { font-size: 22px; }
h3 { font-size: 17px; }
p { margin: 0 0 var(--space-3); }
.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }
:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; text-decoration: none; font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 14px; line-height: 1.2; color: var(--color-text); background: transparent; border: 1px solid transparent; padding: var(--space-2) calc(var(--space-3) * 1.2); border-radius: var(--radius-md); width: 100%; margin-top: var(--space-2); }
.btn-primary { color: var(--color-accent); border-color: var(--color-accent); }
.btn-primary:hover { background: color-mix(in srgb, var(--color-accent) 12%, transparent); }
.btn-primary:active { background: color-mix(in srgb, var(--color-accent) 22%, transparent); }

.field > label { display: block; font-size: 12px; margin-bottom: 5px; color: color-mix(in srgb, var(--color-text) 70%, transparent); }
.input { width: 100%; min-height: 36px; padding: 6px 10px; font: inherit; font-size: 14px; color: var(--color-text); caret-color: var(--color-accent); background: var(--color-surface); border: 1px solid var(--color-divider); border-radius: var(--radius-md); }
.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }
.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }

.card { display: flex; flex-direction: column; gap: var(--space-2); padding: var(--space-4); border-radius: var(--radius-md); background: var(--color-surface); }
.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }
.card-meta { display: flex; align-items: center; gap: 6px; font-size: 11px; color: color-mix(in srgb, var(--color-text) 50%, transparent); }
.elev-sm { box-shadow: var(--shadow-sm); }
.elev-md { box-shadow: var(--shadow-md); }

.tag { display: inline-flex; align-items: center; font-size: 11px; letter-spacing: 0.02em; padding: 3px 10px; border-radius: calc(var(--radius-md) * 0.75); }
.tag-accent { background: var(--color-accent-800); color: var(--color-accent-100); }
.tag-accent-2 { background: var(--color-accent-2-800); color: var(--color-accent-2-100); }
.tag-neutral { background: var(--color-neutral-800); color: var(--color-neutral-100); }
.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }
.tag-red { background: var(--color-red-bg); color: var(--color-red); }
.tag-amber { background: var(--color-amber-bg); color: var(--color-amber); }

.nav { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-6); flex-wrap: wrap; }
.nav-brand { font-family: var(--font-heading); font-weight: var(--font-heading-weight); font-size: 18px; margin-right: auto; }

.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: color-mix(in srgb, var(--color-text) 60%, transparent); padding: var(--space-2); }
.table th.num { text-align: right; }
.table td { padding: var(--space-2); vertical-align: top; }
.table tbody tr { background: linear-gradient(to right, transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 24px, color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 24px), transparent) no-repeat bottom / 100% 1px; }
.table tbody tr:hover { background: linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent), color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0 / 100% 100%, linear-gradient(to right, transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 24px, color-mix(in srgb, var(--color-text) 8%, transparent) calc(100% - 24px), transparent) no-repeat bottom / 100% 1px; }

/* ===================== Estilos específicos deste painel ===================== */
.wrap { max-width: 1180px; margin: 0 auto; }
.section { padding: var(--space-8) var(--space-6) var(--space-4); max-width: 1180px; margin: 0 auto; }
.section + .section { border-top: 1px solid var(--color-divider); }
.section-head { margin-bottom: var(--space-6); }
.section-head h2 { margin-bottom: var(--space-1); }
.section-sub { color: color-mix(in srgb, var(--color-text) 55%, transparent); font-size: 13.5px; }
.kpi-value { font-size: 26px; font-weight: 500; font-family: var(--font-heading); margin: var(--space-2) 0; white-space: nowrap; }
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); }
.split-bar { display: flex; height: 14px; border-radius: var(--radius-sm); overflow: hidden; background: var(--color-neutral-800); }
.legend-row { display: flex; align-items: center; gap: var(--space-2); font-size: 13px; color: var(--color-neutral-300); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
.bar-track-mini { height: 6px; border-radius: var(--radius-sm); background: var(--color-neutral-800); overflow: hidden; margin-top: 6px; }
.bar-fill-mini { height: 100%; border-radius: var(--radius-sm); background: var(--color-accent); }
@keyframes live-pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.55); } 50% { opacity: 0.55; box-shadow: 0 0 0 4px rgba(74, 222, 128, 0); } }
.live-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; animation: live-pulse 1.6s ease-in-out infinite; }
.donut-wrap:hover .donut-label-default { opacity: 0; }
.donut-wrap:hover .donut-label-hover { opacity: 1; }
.donut-label-default, .donut-label-hover { transition: opacity 0.15s ease; }
.donut-label-hover { opacity: 0; }
.empty { text-align: center; padding: 60px 20px; color: color-mix(in srgb, var(--color-text) 55%, transparent); }
.login-wrap { display: flex; align-items: center; justify-content: center; min-height: 80vh; padding: var(--space-4); }
.login-card { width: min(360px, 100%); }
.login-card h2 { margin-top: 0; }
.login-card .erro { color: var(--color-red); font-size: 13px; margin-bottom: 4px; }

@media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }
.map-legend-track { flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--color-neutral-800), var(--color-accent)); }
</style>
<script src="https://unpkg.com/d3@7/dist/d3.min.js"></script>
</head>
<body>
<div id="app"></div>

<script>
// ================== CONFIGURAÇÃO — só isso precisa ser trocado ==================
const API_URL = "https://script.google.com/macros/s/AKfycbxTNAEDQH8IAu59RFIY5IPonXCBzHjGJDAsokt68JW5_siAZLEpUA0h2BcCOtxUJl9BsA/exec";
// ==================================================================================

let dados = null;

function getSenhaSalva(){ return sessionStorage.getItem('painel_senha') || ''; }
function salvarSenha(s){ sessionStorage.setItem('painel_senha', s); }

function renderLogin(erro){
  document.getElementById('app').innerHTML = `
    <div class="login-wrap">
      <div class="card elev-md login-card">
        <h2>Painel de Vendas — Vitanuts</h2>
        ${erro ? '<div class="erro">Senha incorreta.</div>' : ''}
        <div class="field">
          <input class="input" type="password" id="senhaInput" placeholder="Senha" autofocus>
        </div>
        <button class="btn btn-primary" id="btnEntrar">Entrar</button>
      </div>
    </div>
  `;
  document.getElementById('btnEntrar').addEventListener('click', tentarLogin);
  document.getElementById('senhaInput').addEventListener('keydown', (e) => {
    if(e.key === 'Enter') tentarLogin();
  });
}

async function tentarLogin(){
  const senha = document.getElementById('senhaInput').value;
  await carregarDados(senha, false);
}

// ehRefreshDeFundo=true significa "não é o carregamento inicial nem o
// login" — é o setInterval tentando atualizar sozinho. Nesses casos,
// uma falha (comum quando a aba fica muito tempo em segundo plano e o
// navegador atrasa a requisição) não pode apagar o painel que já
// estava funcionando na tela; só tenta de novo silenciosamente.
async function carregarDados(senha, ehRefreshDeFundo){
  const MAX_TENTATIVAS = 3;
  for(let tentativa = 1; tentativa <= MAX_TENTATIVAS; tentativa++){
    try {
      const json = await buscarViaJsonp(API_URL, senha);
      if(json.erro === 'senha_incorreta'){
        renderLogin(true);
        return;
      }
      salvarSenha(senha);
      dados = json;
      render();
      return;
    } catch(err){
      const ultimaTentativa = tentativa === MAX_TENTATIVAS;
      if(!ultimaTentativa){
        await new Promise(r => setTimeout(r, 2000));
        continue;
      }
      if(ehRefreshDeFundo && dados){
        console.warn('Refresh automático falhou, mantendo painel atual:', err.message);
        return;
      }
      document.getElementById('app').innerHTML = `<div class="empty"><p>Erro ao buscar dados: ${err.message}</p></div>`;
    }
  }
}

// Busca os dados via JSONP (uma tag <script> dinâmica) em vez de fetch(),
// porque o navegador bloqueia fetch() entre domínios diferentes (CORS) —
// GitHub Pages e Google Apps Script são domínios diferentes. Tags
// <script> não têm essa restrição.
function buscarViaJsonp(url, senha){
  return new Promise((resolve, reject) => {
    const nomeCallback = 'jsonp_cb_' + Date.now() + '_' + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    let terminou = false;

    window[nomeCallback] = function(dados){
      terminou = true;
      resolve(dados);
      delete window[nomeCallback];
      script.remove();
    };

    script.src = url + '?senha=' + encodeURIComponent(senha) + '&callback=' + nomeCallback + '&_=' + Date.now();
    script.onerror = () => {
      if(!terminou) reject(new Error('Falha ao carregar dados (verifique a URL da API)'));
      delete window[nomeCallback];
      script.remove();
    };
    document.body.appendChild(script);

    setTimeout(() => {
      if(!terminou){
        reject(new Error('Tempo esgotado buscando dados'));
        delete window[nomeCallback];
        script.remove();
      }
    }, 30000);
  });
}

function formatarDataHora(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleString('pt-BR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function brl(v){ return Number(v || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL', maximumFractionDigits:0}); }
function escapeHtml(str){ const div = document.createElement('div'); div.textContent = str ?? ''; return div.innerHTML; }

// cores fixas por grupo — mesma paleta em Faturado e Carteira, pra manter
// o significado consistente entre os dois painéis
const CORES_GRUPO = {
  'B2C': 'var(--color-accent-2)',
  'B2B': 'var(--color-accent)',
  'Não classificado': 'var(--color-neutral-500)',
  'Não identificado': 'var(--color-neutral-500)'
};

function svgDonut(pct, valorLabel, totalLabel){
  const r = 70, c = 2 * Math.PI * r;
  const offset = c * (1 - Math.max(0, Math.min(1, pct)));
  const pctFmt = (pct*100).toFixed(1).replace('.', ',') + '%';
  return `
  <div class="donut-wrap" style="cursor: default;">
    <svg width="164" height="164" viewBox="0 0 160 160" style="flex-shrink: 0;">
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--color-neutral-800)" stroke-width="18"></circle>
      <circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--color-accent)" stroke-width="18" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${offset.toFixed(1)}" stroke-linecap="round" transform="rotate(-90 80 80)"></circle>
      <g class="donut-label-default">
        <text x="80" y="75" text-anchor="middle" font-family="var(--font-heading)" font-size="26" font-weight="500" fill="var(--color-text)">${pctFmt}</text>
        <text x="80" y="96" text-anchor="middle" font-family="var(--font-body)" font-size="10.5" letter-spacing="0.04em" fill="var(--color-neutral-400)">DA META</text>
      </g>
      <g class="donut-label-hover">
        <text x="80" y="73" text-anchor="middle" font-family="var(--font-heading)" font-size="16" font-weight="500" fill="var(--color-text)">${escapeHtml(valorLabel)}</text>
        <text x="80" y="90" text-anchor="middle" font-family="var(--font-body)" font-size="9.5" letter-spacing="0.04em" fill="var(--color-neutral-400)">FATURAMENTO ATUAL</text>
        <text x="80" y="104" text-anchor="middle" font-family="var(--font-body)" font-size="9.5" letter-spacing="0.04em" fill="var(--color-neutral-400)">de ${escapeHtml(totalLabel)}</text>
      </g>
    </svg>
  </div>`;
}

function splitBar(entradas, total){
  if(entradas.length === 0) return '<p class="text-muted" style="font-size:13px;">Sem dados neste período ainda.</p>';
  const segmentos = entradas.map(([nome, valor]) => {
    const pct = total > 0 ? (valor/total*100) : 0;
    const cor = CORES_GRUPO[nome] || 'var(--color-neutral-500)';
    return `<div style="width:${pct.toFixed(2)}%;background:${cor};"></div>`;
  }).join('');
  const legendas = entradas.map(([nome, valor, extra]) => {
    const pct = total > 0 ? (valor/total*100) : 0;
    const cor = CORES_GRUPO[nome] || 'var(--color-neutral-500)';
    return `<div class="legend-row"><span class="legend-dot" style="background:${cor}"></span>${escapeHtml(nome)} · ${brl(valor)} (${pct.toFixed(1).replace('.',',')}%)${extra ? ' · ' + escapeHtml(extra) : ''}</div>`;
  }).join('');
  return `<div class="split-bar" style="margin: var(--space-3) 0;">${segmentos}</div><div style="display:flex;gap:var(--space-6);flex-wrap:wrap;">${legendas}</div>`;
}

function rankingTable(lista){
  if(!lista || lista.length === 0) return '<p class="text-muted" style="font-size:13px;">Sem vendas de produto registradas neste mês ainda.</p>';
  const maior = lista.length ? lista[0].valor : 1;
  const total = lista.reduce((s,p)=>s+p.valor,0);
  const TAG_CANAL = { 'B2C': 'tag-accent-2', 'B2B': 'tag-accent', 'Não classificado': 'tag-neutral' };
  const linhas = lista.map(p => `
    <tr>
      <td>
        <div style="font-weight:500;">${escapeHtml(p.nome)}</div>
        <div class="text-muted" style="font-size:11px;margin-top:1px;">${escapeHtml(p.sku)}</div>
        <div class="bar-track-mini"><div class="bar-fill-mini" style="width:${(p.valor/maior*100).toFixed(0)}%"></div></div>
      </td>
      <td><span class="tag ${TAG_CANAL[p.canal_predominante] || 'tag-neutral'}">${escapeHtml(p.canal_predominante || '—')}</span></td>
      <td class="num">${Number(p.quantidade || 0).toLocaleString('pt-BR')}</td>
      <td class="num">${brl(p.valor)}</td>
      <td class="num text-muted">${total>0 ? (p.valor/total*100).toFixed(1).replace('.',',') : '0,0'}%</td>
    </tr>`).join('');
  return `<table class="table"><thead><tr><th>Produto</th><th>Canal</th><th class="num">Qtd.</th><th class="num">Real R$</th><th class="num">% do top 10</th></tr></thead><tbody>${linhas}</tbody></table>`;
}

// Faturamento por UF — barras horizontais, ordenadas do maior pro menor.
// valorPorCanal: dado um registro de UF ({valor, B2C, B2B, "Não classificado"})
// e um filtro ('todos'|'B2C'|'B2B'), devolve o número certo.
function valorRegiaoPorCanal(registro, canal){
  if(!registro) return 0;
  if(canal === 'todos') return registro.valor || 0;
  return registro[canal] || 0;
}

function regioesBars(grupoRegioes, canal){
  const entradas = Object.entries(grupoRegioes || {})
    .map(([uf, reg]) => [uf, valorRegiaoPorCanal(reg, canal)])
    .filter(([,v]) => v > 0)
    .sort((a,b) => b[1]-a[1]);
  if(entradas.length === 0) return '<p class="text-muted" style="font-size:13px;">Sem dados de região neste período ainda.</p>';
  const total = entradas.reduce((s,[,v])=>s+v, 0);
  const maior = entradas[0][1];
  const linhas = entradas.map(([uf, valor]) => `
    <div style="display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:var(--space-3);margin-bottom:var(--space-2);">
      <span style="font-weight:500;font-size:13px;">${escapeHtml(uf)}</span>
      <div class="bar-track-mini" style="margin-top:0;"><div class="bar-fill-mini" style="width:${(valor/maior*100).toFixed(0)}%"></div></div>
      <span class="num text-muted" style="font-size:12.5px;white-space:nowrap;">${brl(valor)} · ${total>0 ? (valor/total*100).toFixed(1).replace('.',',') : '0,0'}%</span>
    </div>`).join('');
  return linhas;
}

// Tendência diária acumulada — linha simples em SVG, sem depender de
// nenhuma biblioteca de gráfico.
function tendenciaSvg(serie, metaMes){
  if(!serie || serie.length === 0) return '<p class="text-muted" style="font-size:13px;">Sem dados suficientes ainda.</p>';
  const w = 600, h = 160, pad = 8;
  // escala pelo maior valor da PRÓPRIA série — se escalasse pela meta,
  // a curva ficava "achatada" perto do fundo sempre que o acumulado
  // ainda estivesse bem abaixo dela (comum no início do mês).
  const maiorValor = Math.max(...serie.map(p => p.acumulado), 1);
  const pontos = serie.map((p, i) => {
    const x = serie.length > 1 ? (i / (serie.length - 1)) * (w - pad*2) + pad : pad;
    const y = h - pad - (p.acumulado / maiorValor) * (h - pad*2);
    return x.toFixed(1) + ',' + y.toFixed(1);
  }).join(' ');
  const ultimo = serie[serie.length - 1];
  const xUltimo = serie.length > 1 ? (w - pad*2) + pad : pad;
  const yUltimo = h - pad - (ultimo.acumulado / maiorValor) * (h - pad*2);
  // se a meta estiver acima do topo do gráfico, a linha tracejada fica
  // "encostada" no topo em vez de sumir pra fora da área visível
  const yMetaBruto = h - pad - (metaMes / maiorValor) * (h - pad*2);
  const yMeta = Math.max(pad, yMetaBruto);
  return `
  <svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;">
    <line x1="${pad}" y1="${yMeta.toFixed(1)}" x2="${w-pad}" y2="${yMeta.toFixed(1)}" stroke="var(--color-neutral-500)" stroke-width="1" stroke-dasharray="4,4"></line>
    <polyline points="${pontos}" fill="none" stroke="var(--color-accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></polyline>
    <circle cx="${xUltimo.toFixed(1)}" cy="${yUltimo.toFixed(1)}" r="3.5" fill="var(--color-accent)"></circle>
  </svg>`;
}

// Mapa do Brasil por UF — geometria real buscada 1x da API pública do
// IBGE (não é imagem estática) e reaproveitada nos refreshes seguintes.
// Se a busca falhar (rede, CORS, IBGE fora do ar), a área do mapa mostra
// um aviso — mas a lista de barras (sempre renderizada, logo abaixo)
// nunca depende disso, então a seção nunca fica sem informação nenhuma.
const UF_PARA_CODIGO_IBGE = { RO:11, AC:12, AM:13, RR:14, PA:15, AP:16, TO:17, MA:21, PI:22, CE:23, RN:24, PB:25, PE:26, AL:27, SE:28, BA:29, MG:31, ES:32, RJ:33, SP:35, PR:41, SC:42, RS:43, MS:50, MT:51, GO:52, DF:53 };
const CODIGO_IBGE_PARA_UF = Object.fromEntries(Object.entries(UF_PARA_CODIGO_IBGE).map(([uf, cod]) => [cod, uf]));
let MAPA_GEOMETRIA_CACHE = null; // guarda os paths já buscados, entre refreshes
let MAPA_CANAL_ATUAL = 'todos'; // estado do filtro de canal do mapa

function lerpCorMapa(t){
  const base = [63, 66, 77], alvo = [145, 132, 217];
  const r = Math.round(base[0] + (alvo[0]-base[0])*t);
  const g = Math.round(base[1] + (alvo[1]-base[1])*t);
  const b = Math.round(base[2] + (alvo[2]-base[2])*t);
  const hex = n => n.toString(16).padStart(2,'0');
  return '#' + hex(r) + hex(g) + hex(b);
}

async function buscarGeometriaMapa(){
  if(MAPA_GEOMETRIA_CACHE) return MAPA_GEOMETRIA_CACHE;
  const resp = await fetch('https://servicodados.ibge.gov.br/api/v2/malhas/BR?resolucao=2&formato=application/vnd.geo+json');
  const geo = await resp.json();
  const projection = d3.geoMercator().fitSize([680, 560], geo);
  const pathGen = d3.geoPath().projection(projection);
  MAPA_GEOMETRIA_CACHE = geo.features.map(f => {
    const [x, y] = projection(f.properties.centroide);
    return { codigo: Number(f.properties.codarea), d: pathGen(f), x, y };
  });
  return MAPA_GEOMETRIA_CACHE;
}

// Tooltip flutuante customizado (em vez do title nativo do navegador,
// que é feio e não combina com o resto do painel). Um único elemento
// reaproveitado, reposicionado conforme o mouse se move sobre o SVG.
function garantirTooltipMapa(){
  let tt = document.getElementById('mapa-tooltip');
  if(!tt){
    tt = document.createElement('div');
    tt.id = 'mapa-tooltip';
    tt.style.cssText = 'position:fixed;pointer-events:none;z-index:1000;background:var(--color-neutral-100);color:var(--color-neutral-900);font-size:12.5px;font-weight:500;padding:6px 10px;border-radius:var(--radius-sm);box-shadow:var(--shadow-md);display:none;white-space:nowrap;';
    document.body.appendChild(tt);
  }
  return tt;
}

function renderizarMapaComFiltro(alvoSvg, geometria, grupoRegioes, canal){
  const valores = {};
  Object.entries(grupoRegioes || {}).forEach(([uf, reg]) => { valores[uf] = valorRegiaoPorCanal(reg, canal); });
  const total = Object.values(valores).reduce((s,v)=>s+v, 0);
  const maior = Math.max(1, ...Object.values(valores));
  const tooltip = garantirTooltipMapa();

  alvoSvg.innerHTML = geometria.map(f => {
    const uf = CODIGO_IBGE_PARA_UF[f.codigo] || '';
    const valor = valores[uf] || 0;
    const t = Math.sqrt(valor / maior);
    const pct = total > 0 ? (valor/total*100) : 0;
    const nomeUf = escapeHtml(uf || '—');
    const texto = `${nomeUf} — ${brl(valor)} (${pct.toFixed(1).replace('.',',')}% do total)`;
    return `<path d="${f.d}" fill="${lerpCorMapa(t)}" stroke="var(--color-bg)" stroke-width="1" style="cursor:pointer;" data-tooltip="${texto.replace(/"/g,'&quot;')}"></path>`;
  }).join('');

  alvoSvg.querySelectorAll('path').forEach(path => {
    path.addEventListener('mouseenter', () => {
      tooltip.textContent = path.getAttribute('data-tooltip');
      tooltip.style.display = 'block';
      path.setAttribute('stroke', 'var(--color-accent)');
      path.setAttribute('stroke-width', '2');
    });
    path.addEventListener('mousemove', (e) => {
      tooltip.style.left = (e.clientX + 14) + 'px';
      tooltip.style.top = (e.clientY + 14) + 'px';
    });
    path.addEventListener('mouseleave', () => {
      tooltip.style.display = 'none';
      path.setAttribute('stroke', 'var(--color-bg)');
      path.setAttribute('stroke-width', '1');
    });
  });
}

async function tentarRenderizarMapa(grupoRegioes){
  const alvo = document.getElementById('mapa-svg-alvo');
  if(!alvo) return; // a página já pode ter sido re-renderizada antes da busca terminar
  try {
    const geometria = await buscarGeometriaMapa();
    const alvoAtual = document.getElementById('mapa-svg-alvo');
    if(!alvoAtual) return;
    renderizarMapaComFiltro(alvoAtual, geometria, grupoRegioes, MAPA_CANAL_ATUAL);

    // liga o filtro de canal, se ainda não estiver ligado
    const select = document.getElementById('mapa-filtro-canal');
    if(select && !select.dataset.ligado){
      select.dataset.ligado = '1';
      select.addEventListener('change', () => {
        MAPA_CANAL_ATUAL = select.value;
        const svgAtual = document.getElementById('mapa-svg-alvo');
        if(svgAtual) renderizarMapaComFiltro(svgAtual, geometria, grupoRegioes, MAPA_CANAL_ATUAL);
        const rotulo = document.getElementById('mapa-status-label');
        if(rotulo) rotulo.textContent = 'Coloração por faturamento — ' + (MAPA_CANAL_ATUAL === 'todos' ? 'Todos os canais' : MAPA_CANAL_ATUAL);
      });
    }
  } catch(err){
    const alvoAtual = document.getElementById('mapa-svg-alvo');
    if(alvoAtual) alvoAtual.closest('.mapa-wrap').innerHTML = '<p class="text-muted" style="font-size:13px;">Não foi possível carregar o mapa agora — veja a lista por estado abaixo.</p>';
    console.warn('Não foi possível carregar o mapa do Brasil:', err.message);
  }
}

function kpiCard(label, value, tagText, tagClass, statusDot){
  const dot = statusDot ? `<span style="width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;background:${statusDot};"></span>` : '';
  return `
  <div class="card elev-sm">
    <div class="card-kicker" style="display:flex;align-items:center;">${dot}${escapeHtml(label)}</div>
    <div class="kpi-value">${value}</div>
    ${tagText ? `<span class="tag ${tagClass}">${escapeHtml(tagText)}</span>` : ''}
  </div>`;
}

    </nav>

    <section class="section">
      <div class="section-head">
        <div class="card-kicker" style="opacity:0.7;">Visão geral</div>

      ${avisoSync}${avisoCarteira}

        ${svgDonut(pctRealizado, brl(faturamentoReal), brl(metaMes))}
        <div style="width: 1px; height: 96px; background: var(--color-divider);"></div>
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-6);">
          <div>
            <div class="card-kicker" style="display:flex;align-items:center;gap:var(--space-2);"><span style="width:9px;height:9px;border-radius:50%;background:${faturamentoReal>=metaMes?'var(--color-green)':'var(--color-red)'};display:inline-block;"></span>Faturamento real</div>
            <div class="kpi-value">${brl(faturamentoReal)}</div>
            <span class="tag tag-outline">${(pctRealizado*100).toFixed(1).replace('.',',')}% da meta</span>
          </div>
          <div>
            <div class="card-kicker">Meta do mês</div>
            <div class="kpi-value">${brl(metaMes)}</div>
            <span class="tag tag-neutral">fixa por enquanto</span>
          </div>
          <div>
            <div class="card-kicker" style="display:flex;align-items:center;gap:var(--space-2);"><span style="width:9px;height:9px;border-radius:50%;background:var(--color-red);display:inline-block;"></span>Gap até a meta</div>
            <div class="kpi-value">${brl(gapMeta)}</div>

          </div>

      </div>

        ${splitBar(

        <div class="card-kicker" style="opacity:0.7;">Carteira</div>

    <section class="section" id="tendencia">

        <div class="card-kicker" style="opacity:0.7;">Tendência</div>

      <div class="section-head">

      <div class="card elev-sm">

      </div>

    <section class="section" id="regioes">
      <div class="section-head">
        <div class="card-kicker" style="opacity:0.7;">Regiões</div>
        <h2>Faturamento por estado</h2>

      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-3);flex-wrap:wrap;">

          <select class="input" id="mapa-filtro-canal">

            <option value="B2C">B2C</option>
            <option value="B2B">B2B</option>
          </select>
        </div>
        <span class="tag tag-outline" id="mapa-status-label">Coloração por faturamento — Todos os canais</span>
      </div>

      <div class="card elev-sm mapa-wrap" style="padding: var(--space-6); margin-bottom: var(--space-4);">
        <div style="width:100%;max-width:520px;margin:0 auto;">
          <svg id="mapa-svg-alvo" width="100%" height="420" viewBox="0 0 680 560" style="display:block;">
            <text x="340" y="280" text-anchor="middle" font-size="13" fill="var(--color-neutral-500)">Carregando mapa…</text>
          </svg>

      <div class="card elev-sm">
        ${regioesBars(dados.grupo_regioes, 'todos')}

  // tenta desenhar o mapa do Brasil de verdade por cima do placeholder —

  // mapa; a lista logo abaixo nunca depende disso.
  tentarRenderizarMapa(dados.grupo_regioes);
}

  carregarDados(senhaSalva, false);
} else {
  renderLogin(false);
}

  const s = getSenhaSalva();
  if(s) carregarDados(s, true);
}, 5 * 60 * 1000);
</script>
